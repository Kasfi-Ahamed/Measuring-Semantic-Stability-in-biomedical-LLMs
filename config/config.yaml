# Measuring Semantic Stability in Clinical LLMs — central config.
# Paths under data_root live OUTSIDE git (licence + size). Outputs stay in-repo.

project_name: Measuring-Semantic-Stability-in-Clinical-LLMs

data_root: ~/data
hf_home: ~/data/hf_cache
python: ~/.conda/envs/torch_gpu/bin/python

umls:
  meta: ~/data/umls/2026AA/2026AA/META
  release: "2026AA"
  medmentions_gold_release: "2017AA"  # ST21pv gold CUIs; known drift vs 2026AA pool
  pool_full: ~/data/umls/pools/cui_pool_full_umls.pkl
  pool_mesh: ~/data/umls/pools/cui_pool_mesh_subset.pkl
  n_cuis: 3341331
  faiss_dir: ~/data/umls/embeddings/sapbert_full_len3
  faiss_ntotal: 7653278
  sapbert_id: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
  sapbert_revision: 090663c3ae57bf35ffe4d0d468a2a88d03051a4d
  faiss_index_type: IndexFlatIP
  faiss_top_k: 1000
  confidence_threshold: 0.70
  freq_tiebreak_delta: 0.02

datasets:
  medmentions:
    archive: Datasets/MedMentions-master.zip  # local extract; not committed
    extract: Datasets/MedMentions_extracted/MedMentions-master/st21pv/data/corpus_pubtator.txt.gz
    n_mentions_source: 203282
    n_abstracts: 4392
    sample_seed: 42
    # Full run: no PILOT_N / FULL_TARGET_N cap (see Phase 2).
  cadec:
    text_dir: ~/data/cadec/data/cadec/text
    sct_dir: ~/data/cadec/data/cadec/sct
    n_sct_lines: 9111
  bioasq:
    archive: Datasets/BioASQ-training13b.zip
    json_member: BioASQ-training13b/training13b.json
    task: B
    batch: "13b"
    n_questions_all_types: 5389
    n_factoid: 1600
  squad:
    hf_id: rajpurkar/squad_v2
    split: validation
    local_zip: Datasets/SQuAD2.0
    n_validation: 11873
    subsample: null  # full validation; historical pilot used 1000 / seed 13
    seed: 13

perturbation:
  K_PERTURB: 8
  MAX_REGEN_ATTEMPTS: 3
  min_m_accepted: 3
  seed: 42
  gates:
    g1_model: sentence-transformers/all-MiniLM-L6-v2
    g1_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    g1_threshold: 0.85
    g2_concept_model: roberta-large-mnli
    g2_concept_revision: 2a8f12d27941090092df78e4ba6f0928eb5eac98
    g2_threshold_nli: 0.72
    g2_threshold_fallback: 0.85
    g2_qa_model: cross-encoder/nli-MiniLM2-L6-H768
    g2_qa_revision: b95119ce93d3e065de6214e38cd4a97b0f2f2c6d
    g4_languagetool: en-US
    g4_threshold: 0.50
    g5_edit_min: 0.05
    g5_edit_max: 0.60
    g6_concept: true
    g6_qa: false
  paraphrase_models:
    - humarin/chatgpt_paraphraser_on_T5_base
    - Vamsi/T5_Paraphrase_Paws
    - ramsrigouthamg/t5_paraphraser
  back_translation:
    en_de: Helsinki-NLP/opus-mt-en-de
    de_en: Helsinki-NLP/opus-mt-de-en
    pivot: de

inference:
  do_sample: false
  causal_max_new_tokens: 16
  flan_max_new_tokens: 32
  qa_max_new_tokens: 32
  dtype: bfloat16
  encoder_batch_size: 128
  device_map_causal: auto

models:
  bert-base:
    id: bert-base-uncased
    revision: 86b5e0934494bd15c9632b12f734a8a67f723594
    path: null
  biobert:
    id: dmis-lab/biobert-v1.1
    revision: 551ca18efd7f052c8dfa0b01c94c2a8e68bc5488
    path: null
  pubmedbert:
    id: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext
    revision: e1354b7a3a09615f6aba48dfad4b7a613eef7062
    path: null
  flan-t5-base:
    id: google/flan-t5-base
    revision: 7bcac572ce56db69c1ea7c8af255c5d7c9672fc2
    path: null
  mistral:
    id: mistralai/Mistral-7B-Instruct-v0.1
    revision: ec5deb64f2c6e6fa90c1abf74a91d5c93a9669ca
    path: ~/data/models/Mistral-7B-Instruct-v0.1
  biomistral:
    id: BioMistral/BioMistral-7B
    revision: 9a11e1ffa817c211cbb52ee1fb312dc6b61b40a5
    path: ~/data/models/BioMistral-7B
  llama3:
    id: meta-llama/Meta-Llama-3-8B-Instruct
    revision: 8afb486c1db24fe5011ec46dfbe5b5dccdb575c2
    path: ~/data/models/Meta-Llama-3-8B-Instruct
  openbiollm:
    id: aaditya/Llama3-OpenBioLLM-8B
    revision: 70d6bb521cab6ca755b675ade38831eedf89d31c
    path: ~/data/models/Llama3-OpenBioLLM-8B

outputs:
  rq1: outputs/rq1
  rq3: outputs/rq3
  rq4: outputs/rq4
  qa: outputs/qa
  figures: outputs/figures
  k_selection: outputs/rq1/k_selection.json

statistics:
  bootstrap_B: 2000
  bootstrap_seed: 42
  n_random_permutations: 20
  rq3_seed: 42
  holm_alpha: 0.05
  coverage_grid_start: 1.00
  coverage_grid_stop: 0.09
  coverage_grid_step: -0.05

qa:
  nli_model: cross-encoder/nli-MiniLM2-L6-H768
  nli_threshold: 0.72
  min_m: 3
  clustering: bidirectional_entailment
